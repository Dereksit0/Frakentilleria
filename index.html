<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1B1A24" />
    <meta name="description" content="FrankenTillería: artillería por turnos para 2 jugadores. Ensambla. Dispara. Sobrevive." />
    <link rel="icon" href="./assets/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="FrankenTillería" />
    <meta property="og:description" content="Ensambla. Dispara. Sobrevive. Artillería por turnos para 2 jugadores." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./assets/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <title>FrankenTillería</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1a24;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: Nunito, Arial, sans-serif;
      }
      /* The canvas box follows the visible viewport (visualViewport sets --vvh). It spans the full width: on notched phones
         the expanded canvas keeps the HUD (the 16:9 design area) farther from the edges than the notch; top and bottom keep
         the safe areas (status bar, home indicator). */
      #game {
        position: fixed;
        left: 0;
        right: 0;
        top: env(safe-area-inset-top, 0px);
        height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        height: calc(var(--vvh, 100dvh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      }
      #game canvas {
        touch-action: none;
        -webkit-touch-callout: none;
      }
      /* Menu and Lab in the browser only: a taller document lets Safari collapse its bars; the canvas stays fixed. */
      #strip {
        display: none;
      }
      #scrollhint {
        display: none;
        position: fixed;
        left: 50%;
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 5;
        padding: 6px 16px;
        border: 3px solid #0f0e15;
        border-radius: 12px;
        background: #ffe14d;
        color: #0f0e15;
        font-weight: 800;
        font-size: 16px;
        pointer-events: none;
      }
      body.scroll-on {
        overflow-y: scroll;
        overscroll-behavior-y: contain;
      }
      html:has(body.scroll-on),
      body.scroll-on {
        height: auto;
        min-height: 100%;
        overflow-y: scroll;
        overscroll-behavior-y: contain;
      }
      body.scroll-on #strip {
        display: block;
        height: calc(100dvh + 140px);
      }
      body.scroll-on:not(.scrolled) #scrollhint {
        display: block;
      }
      body.scroll-on #game canvas {
        touch-action: pan-y !important;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1b1a24;
        color: #f4efe1;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        font-weight: 800;
        font-size: 28px;
        padding: 24px;
        gap: 16px;
      }
      #rotate .icon {
        font-size: 72px;
        animation: spin 2s ease-in-out infinite;
      }
      @keyframes spin {
        0%, 20% { transform: rotate(0); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (max-width: 900px) and (orientation: portrait) {
        #rotate {
          display: flex;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate .icon { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="strip" aria-hidden="true"></div>
    <div id="scrollhint" role="status">Desliza hacia arriba para ocultar la barra</div>
    <div id="rotate" role="alert">
      <div class="icon" aria-hidden="true">📱</div>
      <div>Gira tu dispositivo</div>
      <div style="font-size: 20px; font-weight: 700">FrankenTillería se juega en horizontal.</div>
    </div>
    <noscript>Necesitas activar JavaScript para jugar FrankenTillería.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
