<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pasa el dispositivo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{ rootStyle }}">
  <div style="{{ innerStyle }}">
    <div style="font-size: 36px; line-height: 44px; color: #F4EFE1">Tu criatura está lista</div>
    <div style="margin-top: 16px; font-family: 'Bungee', sans-serif; font-size: 80px; line-height: 96px; text-align: center; color: #F4EFE1; text-shadow: 4px 0 0 #0F0E15, -4px 0 0 #0F0E15, 0 4px 0 #0F0E15, 0 -4px 0 #0F0E15">Pasa el dispositivo<br>al <span style="color: #FF9A4D">Jugador 2</span></div>
    <div style="margin-top: 24px; font-size: 32px; line-height: 40px; text-align: center; color: #F4EFE1; max-width: 900px">No mires la pantalla del Jugador 2. La criatura de J1 se muestra tapada hasta que empiece el combate.</div>
    <div style="margin-top: 32px; width: 160px; height: 160px; border: 4px solid #0F0E15; border-radius: 16px; background: #4A4466; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 96px; color: #FFE14D">?</div>
    <button onClick="{{ listo }}" style="margin-top: 32px; height: 104px; width: 480px; background: #FFE14D; color: #1B1A24; border: 4px solid #0F0E15; border-radius: 12px; box-shadow: 0 6px 0 #0F0E15; font-family: 'Bungee', sans-serif; font-size: 34px; cursor: pointer">Soy el Jugador 2</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["pc","movil"],"default":"pc"},"onGo":{"editor":null},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const movil = this.props.device === 'movil';
    const w = movil ? 844 : 1600;
    const h = movil ? 390 : 900;
    const iw = movil ? 1949 : 1600;
    const s = movil ? 0.433 : 1;
    return {
      rootStyle: 'position: relative; overflow: hidden; width: ' + w + 'px; height: ' + h + 'px; background: #1B1A24;',
      innerStyle: "position: absolute; left: 0; top: 0; width: " + iw + "px; height: 900px; box-sizing: border-box; padding-top: " + (movil ? 70 : 90) + "px; transform: scale(" + s + "); transform-origin: 0 0; display: flex; flex-direction: column; align-items: center; font-family: 'Nunito', sans-serif; font-weight: 800; background: linear-gradient(180deg, #1B1A24 0%, #3A2F6B 100%);",
      listo: () => { if (this.props.onGo) this.props.onGo('listo'); }
    };
  }
}
</script>
</body>
</html>
