<script type="text/x-dc" data-dc-script data-props='{"head":{"editor":"enum","options":["armadura","espantapajaros","maniqui","juguete","refri"],"default":"armadura"},"torso":{"editor":"enum","options":["armadura","espantapajaros","maniqui","juguete","refri"],"default":"armadura"},"arms":{"editor":"enum","options":["armadura","espantapajaros","maniqui","juguete","refri"],"default":"armadura"},"legs":{"editor":"enum","options":["armadura","espantapajaros","maniqui","juguete","refri"],"default":"armadura"},"size":{"editor":"int","default":160,"min":40,"max":600},"flip":{"editor":"enum","options":["false","true"],"default":"false"},"eyes":{"editor":"enum","options":["neutro","esfuerzo"],"default":"neutro"},"$preview":{"width":132,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const head = p.head ?? 'armadura';
    const torso = p.torso ?? 'armadura';
    const arms = p.arms ?? 'armadura';
    const legs = p.legs ?? 'armadura';
    const size = Number(p.size ?? 160);
    const w = (size * 132) / 160;
    const flip = String(p.flip) === 'true';
    const eyes = p.eyes ?? 'neutro';
    const o = {};
    ['armadura', 'espantapajaros', 'maniqui', 'juguete', 'refri'].forEach((d) => {
      o['h_' + d] = head === d;
      o['t_' + d] = torso === d;
      o['a_' + d] = arms === d;
      o['l_' + d] = legs === d;
    });
    o.boxStyle = 'position: relative; width: ' + w + 'px; height: ' + size + 'px;' + (flip ? ' transform: scaleX(-1);' : '');
    o.eyesNeutro = eyes === 'neutro';
    o.eyesEsfuerzo = eyes === 'esfuerzo';
    return o;
  }
}
</script>
