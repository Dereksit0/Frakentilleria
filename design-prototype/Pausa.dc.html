<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pausa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{ rootStyle }}">
  <div style="{{ innerStyle }}">
    <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #6FB7E8 0%, #BFE3F7 100%)"></div>
    <div style="position: absolute; left: 0; bottom: 0; width: 100%; height: 340px; background: #8A5A22; border-top: 14px solid #5CB85C"></div>
    <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #0F0E15; opacity: 0.7"></div>
    <div style="position: absolute; left: 50%; margin-left: -300px; top: 110px; width: 600px; box-sizing: border-box; padding: 32px; background: #2E2A47; border: 4px solid #0F0E15; border-radius: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center">
      <div style="font-family: 'Bungee', sans-serif; font-size: 56px; line-height: 64px; color: #F4EFE1">Pausa</div>
      <button onClick="{{ continuar }}" style="width: 100%; height: 104px; background: #FFE14D; color: #1B1A24; border: 4px solid #0F0E15; border-radius: 12px; box-shadow: 0 6px 0 #0F0E15; font-family: 'Bungee', sans-serif; font-size: 36px; cursor: pointer">Continuar</button>
      <button onClick="{{ tutorial }}" style="width: 100%; height: 104px; background: #5B3FA0; color: #F4EFE1; border: 4px solid #0F0E15; border-radius: 12px; box-shadow: 0 6px 0 #0F0E15; font-family: 'Bungee', sans-serif; font-size: 30px; cursor: pointer">Cómo jugar</button>
      <button onClick="{{ ajustes }}" style="width: 100%; height: 104px; background: #5B3FA0; color: #F4EFE1; border: 4px solid #0F0E15; border-radius: 12px; box-shadow: 0 6px 0 #0F0E15; font-family: 'Bungee', sans-serif; font-size: 30px; cursor: pointer">Ajustes</button>
      <button onClick="{{ salir }}" style="width: 100%; height: 104px; background: #2E2A47; color: #FF9AA6; border: 4px solid #FF9AA6; border-radius: 12px; font-family: 'Bungee', sans-serif; font-size: 30px; cursor: pointer">Salir al menú</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["pc","movil"],"default":"pc"},"onGo":{"editor":null},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const movil = this.props.device === 'movil';
    const w = movil ? 844 : 1600;
    const h = movil ? 390 : 900;
    const iw = movil ? 1949 : 1600;
    const s = movil ? 0.433 : 1;
    const go = (d) => () => { if (this.props.onGo) this.props.onGo(d); };
    return {
      rootStyle: 'position: relative; overflow: hidden; width: ' + w + 'px; height: ' + h + 'px; background: #1B1A24;',
      innerStyle: "position: absolute; left: 0; top: 0; width: " + iw + "px; height: 900px; transform: scale(" + s + "); transform-origin: 0 0; font-family: 'Nunito', sans-serif; font-weight: 800;",
      continuar: go('continuar'), tutorial: go('tutorial'), ajustes: go('ajustes'), salir: go('menu')
    };
  }
}
</script>
</body>
</html>
