<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tutorial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{ rootStyle }}">
  <div style="{{ innerStyle }}">
    <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #6FB7E8 0%, #BFE3F7 100%)"></div>
    <div style="position: absolute; left: 0; bottom: 0; width: 100%; height: 300px; background: #8A5A22; border-top: 14px solid #5CB85C"></div>
    <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #0F0E15; opacity: 0.55"></div>

    <div style="position: absolute; left: 330px; top: 408px">
      <dc-import name="Criatura" head="armadura" torso="armadura" arms="maniqui" legs="juguete" size="170" eyes="esfuerzo" hint-size="140px,170px"></dc-import>
    </div>

    <div style="{{ bubbleStyle }}">
      <div style="font-size: 26px; line-height: 32px; color: #5B3FA0">Paso {{ stepNum }} de 5</div>
      <div style="margin-top: 6px; font-family: 'Bungee', sans-serif; font-size: 40px; line-height: 48px; color: #1B1A24">{{ stepTitle }}</div>
      <div style="margin-top: 10px; font-size: 32px; line-height: 42px; color: #1B1A24">{{ stepText }}</div>
      <div style="margin-top: 20px; display: flex; gap: 8px">
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="5">
          <div style="{{ d.style }}"></div>
        </sc-for>
      </div>
    </div>

    <div style="position: absolute; left: 0; right: 0; bottom: 32px; display: flex; justify-content: center; gap: 24px">
      <button onClick="{{ saltar }}" style="width: 280px; height: 104px; background: #2E2A47; color: #F4EFE1; border: 4px solid #0F0E15; border-radius: 12px; font-family: 'Bungee', sans-serif; font-size: 28px; cursor: pointer">Saltar</button>
      <button onClick="{{ siguiente }}" style="width: 380px; height: 104px; background: #FFE14D; color: #1B1A24; border: 4px solid #0F0E15; border-radius: 12px; box-shadow: 0 6px 0 #0F0E15; font-family: 'Bungee', sans-serif; font-size: 34px; cursor: pointer">{{ nextLabel }}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["pc","movil"],"default":"pc"},"step":{"editor":"enum","options":["1","2","3","4","5"],"default":"1"},"onGo":{"editor":null},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const movil = this.props.device === 'movil';
    const n = Number(this.props.step || 1);
    const w = movil ? 844 : 1600;
    const h = movil ? 390 : 900;
    const iw = movil ? 1949 : 1600;
    const s = movil ? 0.433 : 1;
    const steps = [
      ['Arma tu criatura', 'En el laboratorio eliges cabeza, torso, brazos y piernas de 5 donantes distintos.'],
      ['Cuida tu presupuesto', 'Cada pieza cuesta puntos. Si te pasas del límite no puedes empezar.'],
      ['Apunta y dispara', 'Arrastra en cualquier zona libre para apuntar. Ajusta la potencia y pulsa ¡Fuego!'],
      ['Mira el viento', 'El viento empuja tus proyectiles. Cambia cada turno, de −5 a +5.'],
      ['Sobrevive a la tormenta', 'Desde la ronda 6 el ácido sube. Quédate en terreno alto y gana al rival.']
    ];
    const cur = steps[Math.min(4, Math.max(0, n - 1))];
    const dots = steps.map((_, i) => ({ style: 'width: 28px; height: 12px; border-radius: 6px; background: ' + (i < n ? '#5B3FA0' : '#C9C3E0') + ';' }));
    return {
      rootStyle: 'position: relative; overflow: hidden; width: ' + w + 'px; height: ' + h + 'px; background: #1B1A24;',
      innerStyle: "position: absolute; left: 0; top: 0; width: " + iw + "px; height: 900px; transform: scale(" + s + "); transform-origin: 0 0; font-family: 'Nunito', sans-serif; font-weight: 800;",
      bubbleStyle: 'position: absolute; left: ' + (iw / 2 - 360) + 'px; top: 180px; width: 720px; box-sizing: border-box; padding: 28px 36px; background: #F4EFE1; border: 4px solid #0F0E15; border-radius: 20px;',
      stepNum: n, stepTitle: cur[0], stepText: cur[1], dots,
      nextLabel: n >= 5 ? '¡A jugar!' : 'Siguiente',
      saltar: () => { if (this.props.onGo) this.props.onGo('saltar'); },
      siguiente: () => { if (this.props.onGo) this.props.onGo('siguiente'); }
    };
  }
}
</script>
</body>
</html>
